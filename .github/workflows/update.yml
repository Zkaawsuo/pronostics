name: Mise à jour des pronos

on:
  schedule:
    # heures UTC (Paris = UTC+1 l'hiver, +2 l'été) : ~7h, 12h, 16h, 19h à Paris
    - cron: "23 6,11,13,15,16,17,18,19 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths: ["pipeline/**", "site/*.*", "site/icons/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pronos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours la dernière version, avec l'historique du calcul précédent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installer les dépendances
        run: pip install -r pipeline/requirements.txt

      - name: Calculer les pronostics
        env:
          FD_KEY: ${{ secrets.FD_KEY }}
          AF_KEY: ${{ secrets.AF_KEY }}
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/build.py

      - name: Vérifier qu'aucune clé ne fuit
        env:
          FD_KEY: ${{ secrets.FD_KEY }}
          AF_KEY: ${{ secrets.AF_KEY }}
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          for k in "$FD_KEY" "$AF_KEY" "$ODDS_KEY" "$TELEGRAM_TOKEN"; do
            k=$(printf '%s' "$k" | tr -d '[:space:]')
            if [ -n "$k" ] && grep -rqF -- "$k" site/; then
              echo "::error::Une clé API a été trouvée dans les fichiers du site : publication annulée."
              exit 1
            fi
          done

      - name: Sauvegarder l'historique
        run: |
          git config user.name "pronos-bot"
          git config user.email "pronos-bot@users.noreply.github.com"
          git add site/data
          git diff --staged --quiet || git commit -m "Pronos $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase -X theirs --autostash || git rebase --abort || true
          git push || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
