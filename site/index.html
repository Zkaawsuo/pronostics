<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Betix">
<title>Betix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<header class="top">
  <div class="brand"><img class="emb" src="icons/logo.svg" alt="" width="34" height="34" style="width:34px;height:34px"><img class="wm" src="icons/wordmark.svg" alt="Betix" height="21" style="height:21px;width:auto"></div>
  <div class="updated" id="updated">Chargement…</div>
</header>

<main id="view-matches" class="view active">
  <div class="chips" id="comp-chips"></div>
  <section id="highlights"></section>
  <div class="row-filters">
    <div class="seg" id="day-seg">
      <button data-v="all" class="on">Tout</button>
      <button data-v="today">Aujourd'hui</button>
      <button data-v="tomorrow">Demain</button>
    </div>
    <div class="seg" id="conf-seg">
      <button data-v="0" class="on">Tous</button>
      <button data-v="2">Moyen+</button>
      <button data-v="3">Fort</button>
    </div>
  </div>
  <div id="match-list"></div>
</main>

<main id="view-tickets" class="view">
  <h2 class="title">Tickets du moment</h2>
  
  <div class="chips" id="book-chips"></div>
  <div class="chips" id="tcomp-chips"></div>
  <div class="stake-row"><span class="src">Mise</span><div class="input small"><input id="stake-in" inputmode="decimal" value="5"><span class="src">€</span></div></div>
  <div id="tickets"></div>
  <div id="combis"></div>
  <div id="buteurs"></div>
  <div id="tickets-track"></div>
</main>

<main id="view-combo" class="view">
  <h2 class="title">Mes paris</h2>
  <div class="seg wide" id="mp-seg"></div>
  <div id="mp-combo">
    <p class="lead">Ajoute des sélections depuis une fiche match. L'app calcule la vraie chance que tout passe.</p>
    <div id="combo"></div>
  </div>
  <div id="mp-bets" hidden></div>
  <div id="mp-stats" hidden></div>
</main>

<main id="view-perf" class="view">
  <h2 class="title">Fiabilité</h2>
  <p class="lead">Ce que vaut vraiment le modèle, mesuré sur des matchs déjà joués.</p>
  <div id="perf"></div>
</main>

<nav class="tabs">
  <button data-view="matches" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>Matchs</button>
  <button data-view="tickets"><svg viewBox="0 0 24 24"><path d="M3 8a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2a2 2 0 0 0 0 4v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/></svg>Tickets</button>
  <button data-view="combo"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Mes paris<span class="badge" id="combo-badge"></span></button>
  <button data-view="perf"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Fiabilité</button>
</nav>

<div class="sheet-bg" id="sheet-bg"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog"></section>
<div class="toast" id="toast"></div>

<script src="app.js?v=11"></script>
</body>
</html>
